# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@main
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@main
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install latest version of uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Set temp directories on Windows
      if: matrix.os == 'windows-latest'
      run: |
        echo "TMPDIR=$env:USERPROFILE\AppData\Local\Temp" >> $env:GITHUB_ENV
        echo "TEMP=$env:USERPROFILE\AppData\Local\Temp" >> $env:GITHUB_ENV
        echo "TMP=$env:USERPROFILE\AppData\Local\Temp" >> $env:GITHUB_ENV
    - name: Install dependencies
      run: |
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        uv sync --frozen --group dev-no-pydantic
    - name: Lint and format with ruff
      run: |
        uv run --frozen --group dev-no-pydantic ruff check
        uv run --frozen --group dev-no-pydantic ruff format --check
    - name: Test without pydantic
      run: |
        uv run --frozen --group dev-no-pydantic pytest --cov=tap
    - name: Test with pydantic v1
      if: matrix.python-version == '3.10' || matrix.python-version == '3.11' || matrix.python-version == '3.12' || matrix.python-version == '3.13'
      run: |
        uv run --frozen --group dev-no-pydantic --with "pydantic < 2" pytest --cov=tap --cov-append
    - name: Test with pydantic v2
      run: |
        uv run --frozen --group dev-no-pydantic --with "pydantic >= 2" pytest --cov=tap --cov-append

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
